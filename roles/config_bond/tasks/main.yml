---
- name: Installer ifenslave
  ansible.builtin.apt:
    name: ifenslave
    state: present

- name: Ecrire la configuration du Bond0 (LAN 2 et 3)
  ansible.builtin.copy:
    dest: /etc/network/interfaces.d/bond0
    content: |
      auto bond0
      iface bond0 inet static
          address 192.168.160.150
          netmask 255.255.255.192
          gateway 192.168.160.190
          bond-slaves ens34 ens35
          bond-mode 4
          bond-miimon 100
          bond-lacp-rate 1
          bond-xmit-hash-policy layer3+4

      auto ens34
      iface ens34 inet manual
          bond-master bond0

      auto ens35
      iface ens35 inet manual
          bond-master bond0

- name: Force le nettoyage et redemarrage reseau
  ansible.builtin.shell: |
    ip link set ens34 down || true
    ip link set ens35 down || true
    ip addr flush ens34 || true
    ip addr flush ens35 || true
    systemctl restart networking
  become: yes
