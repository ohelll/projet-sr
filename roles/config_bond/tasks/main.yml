---
- name: Installer le paquet ifenslave 
  ansible.builtin.apt:
    name: ifenslave
    state: present
    update_cache: yes

- name: Configurer l'interface agrégée (bond0) et ses interfaces physiques
  ansible.builtin.copy:
    dest: /etc/network/interfaces.d/bond0
    content: |
      # L'interface virtuelle agrégée (IP du serveur NFS)
      auto bond0
      iface bond0 inet static
          address 192.168.195.150
          netmask 255.255.255.0
          bond-slaves ens34 ens35
          bond-mode 4
          bond-miimon 100

      # Interface physique 1 (Esclave)
      auto ens34
      iface ens34 inet manual
          bond-master bond0

      # Interface physique 2 (Esclave)
      auto ens35
      iface ens35 inet manual
          bond-master bond0

- name: Redémarrer le service réseau pour appliquer le Bonding
  ansible.builtin.service:
    name: networking
    state: restarted
  async: 1
  poll: 0
