---
- name: Installer bonding
  ansible.builtin.apt:
    name:
      - ifenslave
      - net-tools
    state: present
    update_cache: yes

- name: Configurer bond0
  ansible.builtin.copy:
    dest: /etc/network/interfaces.d/bond0
    content: |
      auto bond0
      iface bond0 inet static
          address 192.168.160.150
          netmask 255.255.255.192
          bond-slaves ens34 ens35
          bond-mode 4
          bond-miimon 100
          bond-lacp-rate 1
          bond-xmit-hash-policy layer3+4

      auto ens34
      iface ens34 inet manual
          bond-master bond0

      auto ens35
      iface ens35 inet manual
          bond-master bond0

- name: Recharger le bonding
  ansible.builtin.shell: |
    /sbin/ifdown bond0 2>/dev/null || true
    /sbin/modprobe bonding
    /sbin/ifup bond0
