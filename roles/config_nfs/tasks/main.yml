---
# Ce fichier ne contient QUE les tâches, pas de "hosts" ou de "tasks:" en haut.

- name: Installer les outils client NFS
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: yes

- name: Créer le point de montage
  ansible.builtin.file:
    path: "/mnt/nfs_serveur"
    state: directory
    mode: '0755'

- name: Monter le dossier distant
  ansible.builtin.mount:
    path: "/mnt/nfs_serveur"
    src: "192.168.160.150:/home/partage_{{ inventory_hostname }}"
    fstype: nfs
    opts: "nfsvers=3,rw,sync"
    state: mounted
