---
# ==========================================
# CONFIGURATION SWITCH 1 (Accès M1 + Serveur)
# ==========================================
- name: Configurer Switch 1 (Accès M1 + Serveur LACP)
  ansible.builtin.command: "{{ item }}"
  loop:
    # 1. Configurer le bridge global
    - net add bridge bridge ports swp1,swp4
    - net add bridge bridge vids 1,3
    # 2. Créer le Bond pour le serveur (LACP mode 4 implicite avec 802.3ad)
    - net add bond bond0 bond slaves swp2-3
    - net add bridge bridge ports bond0
    # 3. Assigner les ports aux VLANs (Access/Trunk)
    - net add interface bond0 bridge access 3
    - net add interface swp1 bridge access 1
    - net add interface swp4 bridge trunk vlans 1,3
    - net commit
  when: inventory_hostname == 'switch1'
  ignore_errors: yes

# ==========================================
# CONFIGURATION SWITCH 2 (Accès M2)
# ==========================================
- name: Configurer Switch 2 (Accès Machine 2)
  ansible.builtin.command: "{{ item }}"
  loop:
    - net add bridge bridge ports swp1-2
    - net add bridge bridge vids 2
    - net add interface swp1 bridge access 2
    - net add interface swp2 bridge trunk vlans 2
    - net commit
  when: inventory_hostname == 'switch2'
  ignore_errors: yes

# ==========================================
# CONFIGURATION SWITCH 3 (Routage L3 + Isolation)
# ==========================================
- name: Configurer Switch 3 (Passerelles et Filtrage)
  ansible.builtin.command: "{{ item }}"
  loop:
    - net add bridge bridge ports swp1-2
    - net add bridge bridge vids 1,2,3
    - net add interface swp1 bridge trunk vlans 1,3
    - net add interface swp2 bridge trunk vlans 2
    - net add vlan 1 ip address 192.168.160.254/26
    - net add vlan 2 ip address 192.168.160.126/26
    - net add vlan 3 ip address 192.168.160.190/26
    - net commit
  when: inventory_hostname == 'switch3'
  ignore_errors: yes

# ==========================================
# RÈGLES D'ISOLATION (Appliquées sur le Switch 3)
# ==========================================
- name: ISOLATION - Bloquer le trafic de M1 vers M2
  ansible.builtin.iptables:
    chain: FORWARD
    source: 192.168.160.0/26
    destination: 192.168.160.64/26
    jump: DROP
  when: inventory_hostname == 'switch3'

- name: ISOLATION - Bloquer le trafic de M2 vers M1
  ansible.builtin.iptables:
    chain: FORWARD
    source: 192.168.160.64/26
    destination: 192.168.160.0/26
    jump: DROP
  when: inventory_hostname == 'switch3'
