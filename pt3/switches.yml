- name: Configuration MLAG et Routing
  hosts: switches
  become: yes
  
  tasks:
    - name: Config Accès (SW1 & SW2)
      when: "inventory_hostname in groups['access_switches']"
      ansible.builtin.shell: |
        net add bridge bridge vlan-aware yes
        net add bond peerlink bond slaves swp3,swp4
        {% if inventory_hostname == 'switch1' %}
        net add interface peerlink clag peer-ip 169.254.1.2 priority 100
        {% else %}
        net add interface peerlink clag peer-ip 169.254.1.1 priority 200
        {% endif %}
        net add bond bond-m1 bond slaves swp1
        net add bond bond-m1 clag id 1
        net add interface bond-m1 bridge access 10
        net add bond bond-m2 bond slaves swp2
        net add bond bond-m2 clag id 2
        net add interface bond-m2 bridge access 20
        net add interface swp5 bridge trunk vlans 1,2
        net commit

    - name: Config Core (SW3)
      when: "inventory_hostname == 'switch3'"
      ansible.builtin.shell: |
        net add bridge bridge vlan-aware yes
        net add bridge bridge ports swp1,swp2
        net add vlan 1 ip address 192.168.1.254/24
        net add vlan 2 ip address 192.168.2.254/24
        net commit
