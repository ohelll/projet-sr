---
- name: Configuration MLAG v4.3 (Downlinks LACP vers machines)
  hosts: access_switches
  become: yes
  gather_facts: no

  tasks:
    - name: Injection de la configuration propre (Methode ifupdown2)
      ansible.builtin.copy:
        dest: /etc/network/interfaces
        content: |
          # --- SYSTEME & MANAGEMENT ---
          auto lo
          iface lo inet loopback

          auto eth0
          iface eth0 inet static
              address {{ ansible_host }}/24
              gateway 192.168.195.1
              vrf mgmt

          auto mgmt
          iface mgmt
              address 127.0.0.1/8
              vrf-table auto

          # --- PEERLINK MLAG ---
          auto peerlink
          iface peerlink
              bond-slaves swp3 swp4
              bond-mode 802.3ad

          auto peerlink.4094
          iface peerlink.4094
              clagd-sys-mac 44:38:39:FF:00:01
              clagd-peer-ip linklocal
              {% if inventory_hostname == 'switch1' %}
              clagd-backup-ip 192.168.195.12
              clagd-priority 100
              {% else %}
              clagd-backup-ip 192.168.195.11
              clagd-priority 200
              {% endif %}

          # --- DOWNLINKS LACP VERS MACHINES ---
          auto bond-m1
          iface bond-m1
              bond-slaves swp1
              bond-mode 802.3ad
              clag-id 1
              bridge-access 10

          auto bond-m2
          iface bond-m2
              bond-slaves swp2
              bond-mode 802.3ad
              clag-id 2
              bridge-access 20

          # --- UPLINK VERS CORE (Trunk Simple) ---
          auto swp5
          iface swp5
              bridge-vids 10 20

          # --- BRIDGE GLOBAL ---
          auto bridge
          iface bridge
              bridge-vlan-aware yes
              bridge-ports peerlink bond-m1 bond-m2 swp5
              bridge-vids 10 20

    - name: Application securisee et relance CLAG
      ansible.builtin.shell: |
        ifreload -a
        systemctl restart clagd
      ignore_errors: yes

- name: Configuration Switch 3 (Core)
  hosts: core_switch
  become: yes
  gather_facts: no

  tasks:
    - name: Injection de la configuration Core
      ansible.builtin.copy:
        dest: /etc/network/interfaces
        content: |
          auto lo
          iface lo inet loopback

          auto eth0
          iface eth0 inet static
              address {{ ansible_host }}/24
              gateway 192.168.195.1
              vrf mgmt

          auto mgmt
          iface mgmt
              address 127.0.0.1/8
              vrf-table auto

          auto swp1
          iface swp1
              bridge-vids 10 20

          auto swp2
          iface swp2
              bridge-vids 10 20

          auto bridge
          iface bridge
              bridge-vlan-aware yes
              bridge-ports swp1 swp2
              bridge-vids 10 20

          auto vlan10
          iface vlan10
              address 192.168.1.254/24
              vlan-id 10
              vlan-raw-device bridge

          auto vlan20
          iface vlan20
              address 192.168.2.254/24
              vlan-id 20
              vlan-raw-device bridge

    - name: Application Core
      ansible.builtin.shell: ifreload -a
      ignore_errors: yes
