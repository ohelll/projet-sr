---
---
- name: Phase No STP - Demonstration de la boucle
  hosts: switches
  become: yes

  tasks:
    - name: Configurer le bridge sans STP (Mode boucle active)
      ansible.builtin.copy:
        dest: /etc/network/interfaces
        content: |
          auto lo
          iface lo inet loopback

          auto eth0
          iface eth0
              address {{ ansible_host }}/24
              vrf mgmt

          auto bridge
          iface bridge
              bridge-ports swp1 swp2 swp3
              bridge-stp off
              bridge-vlan-aware yes

          auto mgmt
          iface mgmt
              address 127.0.0.1/8
              address ::1/128
              vrf-table auto

    - name: Appliquer la configuration
      ansible.builtin.shell: ifreload -a
