---
- name: Configuration de la Topologie Réseau sur les switches
  hosts: switches
  become: yes

  tasks:
    - name: Ajouter les ports swp1-3 au bridge
      ansible.builtin.shell: |
        net add bridge bridge ports swp1-3
        net commit

    - name: Ajouter "bridge-stp off" dans /etc/network/interfaces
      ansible.builtin.lineinfile:
        path: /etc/network/interfaces
        line: "    Bridge-stp yes"
        insertafter: "^iface bridge"
        state: present

    - name: Redémarrer le réseau 
      ansible.builtin.shell: sleep 2 && systemctl restart networking
      async: 10
      poll: 0
      ignore_errors: yes
