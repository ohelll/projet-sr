---
- name: Configurer les Switches
  hosts: switches
  become: yes
  roles:
    - config_vlan

- name: Configurer le serveur NFS
  hosts: serveur_fichier
  become: yes
  roles:
    - config_bond
    - config_nfs

- name: Configurer les clients
  hosts: clients
  become: yes

  tasks:

    - name: Config IP machine1
      ansible.builtin.copy:
        dest: /etc/network/interfaces.d/lan_prod
        content: |
          auto ens34
          iface ens34 inet static
              address 192.168.160.1
              netmask 255.255.255.192
              gateway 192.168.160.254
      when: inventory_hostname == "machine1"

    - name: Config IP machine2
      ansible.builtin.copy:
        dest: /etc/network/interfaces.d/lan_prod
        content: |
          auto ens34
          iface ens34 inet static
              address 192.168.160.100
              netmask 255.255.255.192
              gateway 192.168.160.126
      when: inventory_hostname == "machine2"

    - name: Redémarrer interface
      ansible.builtin.shell: |
        ip addr flush dev ens34 || true
        ifup ens34

- name: Monter le NFS sur les clients
  hosts: clients
  become: yes
  roles:
    - config_nfs
